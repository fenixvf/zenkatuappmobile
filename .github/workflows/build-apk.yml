      - name: Build APK
        run: |
          BUILD_DIR=$(find . -name "settings.gradle" -maxdepth 4 | head -1 | xargs dirname)
          echo "Encontrado em: $BUILD_DIR"
          cd "$BUILD_DIR"
          gradle :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
